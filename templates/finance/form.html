{% extends 'base.html' %}
{% block title_ext %} · {{ title }}{% endblock %}
{% block content %}
<div class="container-fluid pb-4"><div class="row justify-content-center"><div class="col-xl-8"><div class="card"><div class="card-header"><h1 class="card-title h4 font-weight-bold">{{ title }}</h1></div><div class="card-body">
  <p class="text-muted">{{ guidance }}</p>
  <form method="post"{% if multipart %} enctype="multipart/form-data"{% endif %}>{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Save draft</button> <a class="btn btn-link" href="{% url 'finance:workspace' %}">Cancel</a></form>
</div></div></div></div></div>
{% endblock %}
