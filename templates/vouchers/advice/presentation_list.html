{% if presentation_reports %}<div class="card mb-3"><div class="card-header"><h2 class="h6 mb-0">Cheque presentation reports</h2></div><div class="card-body">
{% for report in presentation_reports %}<p class="text-break"><a href="{% url 'vouchers:presentation_detail' report.public_id %}">Cheque {{ report.instrument.check_number }} · {{ report.observed_on }}</a> — {% if report.is_open %}Accounting follow-up{% else %}Resolved{% endif %}</p>{% endfor %}
</div></div>{% endif %}
