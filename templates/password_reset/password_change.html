{% extends 'base.html' %}

{% block content %}
<form id="id_password_change_form" method="POST" class="form-signin gov-auth-form">{% csrf_token %}
  <h1 class="h3 mb-3 font-weight-normal gov-auth-title">Change password</h1>
    <input name="old_password" class="form-control" placeholder="Old password" type="password" id="id_old_password" required="true">
    <input name="new_password1" class="form-control mt-2" placeholder="New password" type="password" id="id_new_password1" required="true">
    <input name="new_password2" class="form-control mt-2" placeholder="Confirm password" type="password" id="id_new_password2" required="true">

    {% for field in form %}
      {% for error in field.errors %}
        <p class="gov-status-note text-danger">{{ error }}</p>
      {% endfor %}
    {% endfor %}

  <button id="id_submit_btn" class="btn btn-lg btn-primary btn-block" type="submit">Update</button>  
</form>


{% endblock content %}
