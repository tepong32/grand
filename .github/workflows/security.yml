name: Security and regression checks

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SKEY: ci-only-secret-key
      DJANGO_SETTINGS_MODULE: src.settings.dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Detect missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run project tests
        run: python manage.py test

      - name: Run Telegram bot tests
        run: python manage.py test telegram_bot
