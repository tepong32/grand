name: Security and regression checks

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SKEY: ci-only-secret-key
      DJANGO_SETTINGS_MODULE: src.settings.dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Detect missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run project tests
        run: python manage.py test

      - name: Run Telegram bot tests
        run: python manage.py test telegram_bot

  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SKEY: ci-only-secret-key
      GRAND_TEST_MYSQL_USER: root
      GRAND_TEST_MYSQL_PASSWORD: grand-ci-disposable-password
    services:
      mysql:
        image: container-registry.oracle.com/mysql/community-server@sha256:7dcc4add9183664de3a214daf85a50c3ba6cccfd7534f700b6561bf5b41885be
        env:
          MYSQL_ROOT_PASSWORD: grand-ci-disposable-password
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping --protocol=tcp --host=127.0.0.1 --silent"
          --health-start-period=30s
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run fresh native two-store regression
        env:
          GRAND_TEST_MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: python scripts/run_mysql_tests.py
